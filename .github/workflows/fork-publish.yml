name: Publish fork image

on:
  workflow_dispatch:

# A running publish must finish before another can promote the moving tag.
concurrency:
  group: publish-fork
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate fork
    if: github.repository == 'magrhino/ShelfBridge' && github.ref == 'refs/heads/fork'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check

  publish:
    name: Build, verify, and promote
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/magrhino/shelfbridge
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build commit image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=ShelfBridge
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Generate attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify published images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          run_native_test() {
            local platform="$1"
            local platform_digest="$2"

            echo "🧪 Testing native module on $platform..."
            docker run --rm --pull=always --platform "$platform" --entrypoint="" \
              "$IMAGE@$platform_digest" npm run test:native
            docker run --rm --pull=always --platform "$platform" --user 1000:1000 --entrypoint="" \
              "$IMAGE@$platform_digest" npm run test:native-lifecycle
          }

          echo "🔍 Verifying multi-architecture manifest..."
          manifest=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")
          platforms=$(jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' <<< "$manifest")
          echo "$platforms"
          grep -qx 'linux/amd64' <<< "$platforms"
          grep -qx 'linux/arm64' <<< "$platforms"

          amd64_digest=$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest' <<< "$manifest")
          arm64_digest=$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")][0].digest' <<< "$manifest")

          # Each architecture must use its child-manifest digest. Reusing the
          # multi-arch index digest makes Docker reject the second platform with
          # "cannot overwrite digest" after the first platform is pulled.
          run_native_test linux/amd64 "$amd64_digest"
          run_native_test linux/arm64 "$arm64_digest"

          echo "✅ Multi-architecture image verified"

      # This is the only step that changes the image used by running installs.
      - name: Promote verified image to fork
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:fork" "$IMAGE@$DIGEST"

      - name: Publish summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Published: $IMAGE:fork"
            echo "Commit image: $IMAGE:sha-$GITHUB_SHA"
            echo "Pin or roll back with: $IMAGE@$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
